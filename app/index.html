<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Five Good Things</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column like the take-home sheet; the day's score sits on top, the five goals below it, the full school sheet one tab away. */
:root {
  --bg: #f1f4fc; --surface: #ffffff; --ink: #1b2340; --muted: #5a6385;
  --pen: #2b47c9; --pen-soft: #e2e8fc; --line: #d3d9ef;
  --star: #f0ab12; --good: #1c8556; --mid: #a86d00; --bad: #c23b2b;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11152a; --surface: #1a2040; --ink: #eef0fb; --muted: #a2aacb;
  --pen: #93a6ff; --pen-soft: #27316a; --line: #303866;
  --star: #f7c648; --good: #62d19c; --mid: #f1b750; --bad: #ff8d7b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11152a; --surface: #1a2040; --ink: #eef0fb; --muted: #a2aacb;
  --pen: #93a6ff; --pen-soft: #27316a; --line: #303866;
  --star: #f7c648; --good: #62d19c; --mid: #f1b750; --bad: #ff8d7b; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15 }
h1 { font-size: 1.7rem } h2 { font-size: 1.15rem }
p { margin: 0 }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
.tabs { display: flex; gap: 4px; background: var(--pen-soft); padding: 4px; border-radius: 999px }
.tabs a { padding: 6px 14px; border-radius: 999px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: .9rem }
.tabs a[aria-current="page"] { background: var(--pen); color: var(--surface) }
.daynav { display: flex; align-items: center; gap: 8px; font-weight: 700 }
.daynav button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.1rem; line-height: 1 }
.daynav span { min-width: 9.5em; text-align: center }
#status { min-height: 1.3em; font-size: .85rem; color: var(--muted) }

.score { display: flex; align-items: center; gap: 20px; flex-wrap: wrap }
.ring { position: relative; width: 116px; height: 116px; flex: none }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 1.7rem var(--display); font-variant-numeric: tabular-nums }
.score-text { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px }
.stars { display: flex; gap: 4px }
.stars svg { width: 30px; height: 30px; fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round }
.stars .full { fill: var(--star); stroke: var(--star) }
.stars .half { fill: var(--pen-soft); stroke: var(--star) }
.muted { color: var(--muted); font-size: .92rem }

.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: g }
.goal { counter-increment: g; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 34px 1fr; gap: 4px 12px }
.goal::before { content: counter(g); grid-row: span 3; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--pen); color: var(--pen); display: grid; place-items: center; font: 600 1.05rem var(--display) }
.goal > * { min-width: 0 }
.goal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.tag { letter-spacing: 0; text-transform: none; padding: 1px 9px; border-radius: 999px; border: 1.5px solid currentColor }
.tag.fix { color: var(--bad) } .tag.keep { color: var(--good) }
.goal textarea { width: 100%; border: 1.5px solid transparent; border-radius: 8px; background: transparent; padding: 2px 4px; margin-left: -4px; font: 500 1.2rem/1.3 var(--display); resize: none; field-sizing: content; min-height: 1.6em }
.goal textarea:hover, .goal textarea:focus { border-color: var(--line); background: var(--bg) }
.goal-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px }
.goal-foot .faces { margin-left: auto }
.why { font-size: .88rem; color: var(--pen); font-style: italic; overflow-wrap: anywhere }

.faces { display: flex; gap: 6px }
.face { width: 40px; height: 40px; padding: 5px; border-radius: 50%; border: 1.5px solid transparent; background: transparent; color: var(--muted); opacity: .55 }
.face svg { width: 100%; height: 100%; display: block }
.face:hover { opacity: 1 }
.face[aria-pressed="true"] { opacity: 1; background: var(--pen-soft); border-color: currentColor }
.face[aria-pressed="true"][data-face="happy"] { color: var(--good) }
.face[aria-pressed="true"][data-face="ok"] { color: var(--mid) }
.face[aria-pressed="true"][data-face="sad"] { color: var(--bad) }
.face[aria-pressed="true"][data-face="missed"] { color: var(--ink) }

.sheet { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.row strong { font-weight: 700 }
.row input { grid-column: 1 / -1; min-width: 0 }
input[type=text], .notes textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); padding: 7px 10px; color: var(--pen) }
.notes { display: flex; flex-direction: column; gap: 12px }
.notes label { display: flex; flex-direction: column; gap: 4px; font-weight: 700 }
.notes textarea { min-height: 4.5em; resize: vertical; font-weight: 400 }
.primary { align-self: flex-start; display: inline-block; text-decoration: none; background: var(--pen); color: var(--surface); border: 0; border-radius: 999px; padding: 11px 22px; font: 600 1rem var(--display) }
#note { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center }
#note:empty { display: none }
#note button { border: 0; background: none; padding: 0; color: var(--pen); text-decoration: underline; font-size: inherit }
#note form { margin: 0 }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--muted) }

.week { display: flex; flex-direction: column; gap: 10px }
.dayrow { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.dayrow-top { display: flex; justify-content: space-between; gap: 12px; font-weight: 700 }
.bar { height: 10px; border-radius: 999px; background: var(--pen-soft); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--star); border-radius: 999px }
.strip { display: flex; flex-wrap: wrap; gap: 3px }
.strip svg { width: 20px; height: 20px }
.strip .happy { color: var(--good) } .strip .ok { color: var(--mid) } .strip .sad { color: var(--bad) } .strip .missed { color: var(--muted) }
.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { .ring circle.fill { transition: stroke-dashoffset .5s ease } }
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <nav class="tabs" aria-label="Views">
      <a href="#today" data-tab="today">The five</a>
      <a href="#report" data-tab="report">School sheet</a>
      <a href="#week" data-tab="week">Days</a>
    </nav>
    <div class="daynav" id="daynav">
      <button type="button" data-nav="-1" aria-label="Previous school day">&#8249;</button>
      <span id="daylabel"></span>
      <button type="button" data-nav="1" aria-label="Next school day">&#8250;</button>
    </div>
  </div>
  <div id="status" role="status">Opening the saved days…</div>
  <p class="muted" id="note"></p>
  <main id="main">
    <div class="empty">The five good things for the day show here, with a star for each one earned at school.</div>
  </main>
</div>

<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
